        // ==================== SCENE 8: GIFT HINT ====================
        function drawGiftHint() {
            const canvas = document.getElementById('gift-hint-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Responsive sizing
            const isMobile = canvas.width < 600;
            const isSmallMobile = canvas.width < 400;
            const mainFontSize = isSmallMobile ? 16 : (isMobile ? 20 : 28);
            const subFontSize = isSmallMobile ? 14 : (isMobile ? 17 : 22);
            const emojiSize = isSmallMobile ? 35 : (isMobile ? 42 : 50);
            
            let startTime = Date.now();
            let particles = [];
            let revealedChars = 0;
            
            const mainText = "Ton cadeau se cache dans ce site...";
            const subText = "Sauras-tu le trouver?";
            
            // Floating gift boxes - fewer on mobile
            const gifts = [];
            const numGifts = isSmallMobile ? 4 : (isMobile ? 6 : 8);
            for (let i = 0; i < numGifts; i++) {
                gifts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: (isSmallMobile ? 15 : 20) + Math.random() * (isSmallMobile ? 20 : 30),
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 2,
                    floatOffset: Math.random() * Math.PI * 2,
                    opacity: 0.3 + Math.random() * 0.4
                });
            }
            
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }
            
            function drawGiftBox(x, y, size, rotation, opacity) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation * Math.PI / 180);
                ctx.globalAlpha = opacity;
                
                // Box body
                ctx.fillStyle = '#ff6b9d';
                ctx.fillRect(-size/2, -size/2, size, size);
                
                // Ribbon vertical
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(-size/8, -size/2, size/4, size);
                
                // Ribbon horizontal
                ctx.fillRect(-size/2, -size/8, size, size/4);
                
                // Bow
                ctx.beginPath();
                ctx.arc(-size/4, -size/2, size/5, 0, Math.PI * 2);
                ctx.arc(size/4, -size/2, size/5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalAlpha = 1;
                ctx.restore();
            }
            
            function addSparkle(x, y) {
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        size: 2 + Math.random() * 3,
                        life: 1,
                        color: Math.random() > 0.5 ? '#ffd700' : '#ff6b9d'
                    });
                }
            }
            
            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                
                // Clear
                ctx.fillStyle = '#030305';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Ambient glow
                const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 300);
                gradient.addColorStop(0, 'rgba(255, 107, 157, 0.15)');
                gradient.addColorStop(1, 'rgba(255, 107, 157, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(cx, cy, 300, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw floating gift boxes
                gifts.forEach(g => {
                    g.rotation += g.rotSpeed;
                    const floatY = Math.sin(elapsed * 2 + g.floatOffset) * 15;
                    drawGiftBox(g.x, g.y + floatY, g.size, g.rotation, g.opacity);
                });
                
                // Update particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                
                // Reveal main text character by character (faster)
                const charsPerSecond = 4;
                const targetChars = Math.floor(elapsed * charsPerSecond);
                
                if (targetChars > revealedChars && revealedChars < mainText.length) {
                    revealedChars = Math.min(targetChars, mainText.length);
                    addSparkle(cx + (revealedChars - mainText.length/2) * 10, cy - 30);
                    playTone(400 + revealedChars * 10, 0.08, 'sine', 0.05);
                }
                
                // Draw revealed text
                ctx.font = `bold ${mainFontSize}px Quicksand, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Main text with glow
                const displayText = mainText.substring(0, revealedChars);
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff6b9d';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(displayText, cx, cy - 30);
                
                // Cursor blink
                if (revealedChars < mainText.length && Math.floor(elapsed * 2) % 2 === 0) {
                    const textWidth = ctx.measureText(displayText).width;
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(cx + textWidth/2 + 5, cy - 45, 3, 30);
                }
                
                // Sub text after main text is complete
                const textCompleteTime = mainText.length / charsPerSecond;
                if (revealedChars >= mainText.length && elapsed > textCompleteTime + 0.5) {
                    const subAlpha = Math.min((elapsed - textCompleteTime - 0.5) / 0.8, 1);
                    ctx.font = `${subFontSize}px Quicksand, sans-serif`;
                    ctx.fillStyle = `rgba(255, 215, 0, ${subAlpha})`;
                    ctx.shadowColor = '#ffd700';
                    ctx.fillText(subText, cx, cy + 30);
                    
                    // Gift emoji animation
                    if (subAlpha >= 0.8) {
                        const bounce = Math.sin(elapsed * 3) * 8;
                        ctx.font = `bold ${emojiSize}px Arial`;
                        ctx.fillStyle = '#ff6b9d';
                        ctx.fillText('🎁', cx, cy + (isMobile ? 90 : 110) + bounce);
                    }
                }
                
                ctx.shadowBlur = 0;
                
                // Continue animation for 12 seconds
                if (elapsed < 12) {
                    requestAnimationFrame(animate);
                }
            }
            
            animate();
        }

        // ==================== SCENE 9: iPHONE SCENE - 3RD MONTH ====================
        function drawAppleScene() {
            const canvas = document.getElementById('apple-scene-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            let startTime = Date.now();
            let particles = [];
            
            const messages = [
                { text: "Pour notre 3eme mois...", delay: 0 },
                { text: "Et pour te dire que je veux vraiment", delay: 3 },
                { text: "construire une histoire avec toi...", delay: 5.5 },
                { text: "Voici un petit quelque chose", delay: 8 },
                { text: "pour le 20 Mars", delay: 10.5 },
                { text: "Tu aimes les pommes non?", delay: 13, special: true }
            ];
            
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }
            
            function easeOutElastic(t) {
                const c4 = (2 * Math.PI) / 3;
                return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
            }
            
            function drawIPhone(x, y, width, height, progress) {
                ctx.save();
                ctx.translate(x, y);
                
                const scale = easeOutElastic(Math.min(progress, 1));
                ctx.scale(scale, scale);
                
                const cornerRadius = 35;
                
                // Phone shadow
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowOffsetY = 10;
                
                // Phone body - rounded rectangle
                ctx.beginPath();
                ctx.roundRect(-width/2, -height/2, width, height, cornerRadius);
                
                // Gradient for phone body (space gray)
                const bodyGradient = ctx.createLinearGradient(-width/2, 0, width/2, 0);
                bodyGradient.addColorStop(0, '#2d2d2d');
                bodyGradient.addColorStop(0.5, '#4a4a4a');
                bodyGradient.addColorStop(1, '#2d2d2d');
                ctx.fillStyle = bodyGradient;
                ctx.fill();
                
                ctx.shadowBlur = 0;
                
                // Phone frame border
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Screen
                const screenMargin = 8;
                const screenWidth = width - screenMargin * 2;
                const screenHeight = height - screenMargin * 2;
                
                ctx.beginPath();
                ctx.roundRect(-screenWidth/2, -screenHeight/2, screenWidth, screenHeight, cornerRadius - 5);
                
                // Screen gradient (dark with slight glow)
                const screenGradient = ctx.createLinearGradient(0, -screenHeight/2, 0, screenHeight/2);
                screenGradient.addColorStop(0, '#1a1a2e');
                screenGradient.addColorStop(0.5, '#16213e');
                screenGradient.addColorStop(1, '#0f0f23');
                ctx.fillStyle = screenGradient;
                ctx.fill();
                
                // Dynamic Island (notch)
                ctx.beginPath();
                ctx.roundRect(-45, -screenHeight/2 + 15, 90, 28, 14);
                ctx.fillStyle = '#000000';
                ctx.fill();
                
                // Camera dot in dynamic island
                ctx.beginPath();
                ctx.arc(25, -screenHeight/2 + 29, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#1a1a2e';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(25, -screenHeight/2 + 29, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#0a3d62';
                ctx.fill();
                
                // Home indicator bar
                ctx.beginPath();
                ctx.roundRect(-50, screenHeight/2 - 25, 100, 5, 3);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
                
                // Side button (right)
                ctx.fillStyle = '#3d3d3d';
                ctx.fillRect(width/2, -30, 3, 50);
                
                // Volume buttons (left)
                ctx.fillRect(-width/2 - 3, -60, 3, 25);
                ctx.fillRect(-width/2 - 3, -25, 3, 25);
                
                // Silent switch
                ctx.fillRect(-width/2 - 3, -90, 3, 15);
                
                ctx.restore();
                
                return { screenWidth, screenHeight };
            }
            
            function drawScreenContent(x, y, screenWidth, screenHeight, elapsed, phoneProgress) {
                if (phoneProgress < 1) return;
                
                ctx.save();
                ctx.translate(x, y);
                
                const contentAlpha = Math.min((phoneProgress - 1) / 1, 1);
                ctx.globalAlpha = contentAlpha;
                
                // Time display at top
                if (contentAlpha > 0.3) {
                    ctx.font = 'bold 16px -apple-system, sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.textAlign = 'center';
                    ctx.fillText('20:03', 0, -screenHeight/2 + 60);
                    
                    // Date hint
                    ctx.font = '12px -apple-system, sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.fillText('Jeudi 20 Mars', 0, -screenHeight/2 + 78);
                }
                
                // Hint text on screen (no Apple logo)
                const textProgress = Math.min((elapsed - 18) / 1.5, 1);
                if (textProgress > 0) {
                    // Small heart only
                    ctx.font = '24px Arial';
                    ctx.fillStyle = `rgba(255, 107, 157, ${easeOutCubic(textProgress)})`;
                    ctx.textAlign = 'center';
                    ctx.fillText('♥', 0, 20);
                }
                
                ctx.globalAlpha = 1;
                ctx.restore();
            }
            
            function drawHeart(x, y, size, alpha) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(size / 30, size / 30);
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.bezierCurveTo(-12, -22, -28, -5, 0, 18);
                ctx.bezierCurveTo(28, -5, 12, -22, 0, -8);
                ctx.fillStyle = `rgba(255, 107, 157, ${alpha})`;
                ctx.fill();
                ctx.restore();
            }
            
            function addParticle(x, y, color) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5 - 1,
                    size: 2 + Math.random() * 3,
                    life: 1,
                    color: color || '#ff6b9d'
                });
            }
            
            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                
                // Clear
                ctx.fillStyle = '#030305';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Beautiful background gradient
                const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(canvas.width, canvas.height) * 0.7);
                bgGradient.addColorStop(0, 'rgba(100, 100, 120, 0.1)');
                bgGradient.addColorStop(0.5, 'rgba(50, 50, 70, 0.05)');
                bgGradient.addColorStop(1, 'rgba(3, 3, 5, 0)');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Floating hearts in background
                for (let i = 0; i < 5; i++) {
                    const heartX = cx + Math.sin(elapsed * 0.4 + i * 1.5) * 250;
                    const heartY = cy + Math.cos(elapsed * 0.25 + i * 2) * 180;
                    drawHeart(heartX, heartY, 12 + i * 2, 0.15);
                }
                
                // Update and draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.015;
                    
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                
                // Draw messages with fade effect
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                messages.forEach((msg, index) => {
                    if (elapsed > msg.delay) {
                        const msgProgress = Math.min((elapsed - msg.delay) / 1.8, 1);
                        const alpha = easeOutCubic(msgProgress);
                        const yOffset = (1 - msgProgress) * 25;
                        
                        // Special styling for "Tu aimes les pommes non?"
                        if (msg.special) {
                            ctx.font = 'bold 28px Pacifico, cursive';
                            ctx.fillStyle = `rgba(255, 107, 157, ${alpha})`;
                            ctx.shadowBlur = 20;
                            ctx.shadowColor = '#ff6b9d';
                            const yPos = cy - 220 + index * 40 - yOffset;
                            ctx.fillText(msg.text, cx, yPos);
                            
                            // Add wink emoji after
                            if (alpha > 0.7) {
                                ctx.font = '26px Arial';
                                const winkAlpha = (alpha - 0.7) / 0.3;
                                ctx.fillStyle = `rgba(255, 255, 255, ${winkAlpha})`;
                                ctx.fillText(' 😉', cx + ctx.measureText(msg.text).width / 2 + 20, yPos);
                            }
                        } else {
                            ctx.font = index === 0 ? 'bold 26px Quicksand, sans-serif' : '22px Quicksand, sans-serif';
                            ctx.fillStyle = index === 0 ? `rgba(255, 215, 0, ${alpha})` : `rgba(255, 255, 255, ${alpha})`;
                            ctx.shadowBlur = 15;
                            ctx.shadowColor = index === 0 ? '#ffd700' : '#ff6b9d';
                            const yPos = cy - 220 + index * 40 - yOffset;
                            ctx.fillText(msg.text, cx, yPos);
                        }
                    }
                });
                ctx.shadowBlur = 0;
                
                // Draw the iPhone after "Tu aimes les pommes" message
                if (elapsed > 16) {
                    const phoneProgress = (elapsed - 16) / 2;
                    
                    // iPhone glow
                    if (phoneProgress > 0) {
                        const glowSize = 180 * Math.min(phoneProgress, 1);
                        const glowGradient = ctx.createRadialGradient(cx, cy + 60, 0, cx, cy + 60, glowSize);
                        glowGradient.addColorStop(0, 'rgba(150, 150, 170, 0.3)');
                        glowGradient.addColorStop(0.5, 'rgba(100, 100, 120, 0.1)');
                        glowGradient.addColorStop(1, 'rgba(50, 50, 70, 0)');
                        ctx.fillStyle = glowGradient;
                        ctx.beginPath();
                        ctx.arc(cx, cy + 60, glowSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    // Draw iPhone
                    const phoneWidth = 140;
                    const phoneHeight = 280;
                    const screenInfo = drawIPhone(cx, cy + 60, phoneWidth, phoneHeight, phoneProgress);
                    
                    // Draw screen content
                    drawScreenContent(cx, cy + 60, screenInfo.screenWidth, screenInfo.screenHeight, elapsed, phoneProgress);
                    
                    // Add particles when phone appears
                    if (phoneProgress > 0 && phoneProgress < 0.8 && Math.random() > 0.8) {
                        addParticle(cx + (Math.random() - 0.5) * 150, cy + 60, '#888');
                    }
                    
                    // Date text below phone
                    if (phoneProgress > 2) {
                        const dateAlpha = Math.min((phoneProgress - 2) / 1.5, 1);
                        ctx.font = 'bold 34px Pacifico, cursive';
                        ctx.fillStyle = `rgba(255, 215, 0, ${dateAlpha})`;
                        ctx.shadowBlur = 25;
                        ctx.shadowColor = '#ffd700';
                        ctx.textAlign = 'center';
                        ctx.fillText('20 Mars 2026', cx, cy + 240);
                        
                        // Hearts around the date
                        if (dateAlpha > 0.5) {
                            const heartAlpha = (dateAlpha - 0.5) * 2;
                            ctx.font = '28px Arial';
                            ctx.fillStyle = `rgba(255, 107, 157, ${heartAlpha})`;
                            const bounce = Math.sin(elapsed * 3) * 5;
                            ctx.fillText('♥', cx - 130, cy + 240 + bounce);
                            ctx.fillText('♥', cx + 130, cy + 240 - bounce);
                        }
                        
                        ctx.shadowBlur = 0;
                    }
                }
                
                // Continue animation
                if (elapsed < 24) {
                    requestAnimationFrame(animate);
                }
            }
            
            animate();
        }

                            duration: 1, 
                            ease: 'elastic.out(1.2, 0.4)',
                            onComplete: () => {
                                createFirework(cx, cy);
                                playSuccess();
                            }
                        }
                    );
                })
                .to({}, { duration: 0.4 })
                
                // Love text slides in
                .call(() => {
                    gsap.fromTo('.love-text',
                        { x: -100, opacity: 0 },
                        { x: 0, opacity: 1, duration: 0.6, ease: 'back.out(1.5)' }
                    );
                })
                .to({}, { duration: 0.3 })
                
                // Hearts row with stagger
                .call(() => {
                    gsap.fromTo('.hearts-row',
                        { scale: 0, opacity: 0 },
                        { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)' }
                    );
                    heartBurst(cx, cy + 50, 25);
                })
                .to({}, { duration: 0.3 })
                
                // Final message
                .call(() => {
                    gsap.fromTo('.final-message',
                        { y: 30, opacity: 0 },
                        { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }
                    );
                    sparkle(cx - 100, cy + 150, 10);
                    sparkle(cx + 100, cy + 150, 10);
                })
                
                // Phase 10: Start continuous celebration effects
                .call(() => {
                    // Falling hearts continuously
                    setInterval(() => createFallingHearts(), 150);
                    
                    // Fireworks at random positions
                    setTimeout(() => createFirework(window.innerWidth * 0.2, window.innerHeight * 0.3), 500);
                    setTimeout(() => createFirework(window.innerWidth * 0.8, window.innerHeight * 0.4), 800);
                    setTimeout(() => createFirework(window.innerWidth * 0.5, window.innerHeight * 0.3), 1200);
                    
                    // Continuous random fireworks
                    setInterval(() => {
                        createFirework(
                            Math.random() * window.innerWidth, 
                            Math.random() * window.innerHeight * 0.5 + window.innerHeight * 0.1
                        );
                    }, 1500);
                    
                    // Continuous confetti from sides
                    setInterval(() => { 
                        confetti({ particleCount: 40, angle: 60, spread: 55, origin: { x: 0, y: 0.6 }, colors: ['#ff6b9d', '#ffd700'] }); 
                        confetti({ particleCount: 40, angle: 120, spread: 55, origin: { x: 1, y: 0.6 }, colors: ['#ff6b9d', '#ffd700'] }); 
                    }, 400);
                    
                    // Center confetti bursts
                    setInterval(() => { 
                        confetti({ particleCount: 60, spread: 120, origin: { x: 0.5, y: 0.7 }, colors: ['#ff6b9d', '#ffd700', '#ffc2d1'] }); 
                    }, 600);
                    
                    // Random sparkle bursts
                    setInterval(() => {
                        sparkle(Math.random() * window.innerWidth, Math.random() * window.innerHeight, 10);
                    }, 400);
                    
                    // Pulse the title periodically
                    setInterval(() => {
                        gsap.to('#success h1', { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1 });
                    }, 3000);
                });
        }
        
        // Track if the experience is ready for button interaction
        let buttonsReady = false;
        
        document.getElementById('yes-btn').onclick = function(e) {
            // Prevent accidental clicks before buttons are ready
            if (!buttonsReady || !this.classList.contains('active')) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            runCinematicYesSequence(e);
        };

        // ==================== NO BUTTON - PLAYFUL ESCAPE ====================
        const noBtn = document.getElementById('no-btn');
        const noTexts = ['Non', 'Vraiment?', 'Tu es sure?', 'Reflechis bien!', 'Mais...', 'Alleeeez!', 'Stp!', 'Jamais!'];
        let noIdx = 0;
        let noClickCount = 0;
        
        // Make the button escape on hover
        noBtn.onmouseover = function(e) {
            const btn = e.target;
            const rect = btn.getBoundingClientRect();
            const maxX = window.innerWidth - rect.width - 50;
            const maxY = window.innerHeight - rect.height - 50;
            
            // Calculate escape direction away from mouse
            let newX = (Math.random() - 0.5) * 300;
            let newY = (Math.random() - 0.5) * 200;
            
            // Ensure button stays on screen
            const currentX = parseFloat(gsap.getProperty(btn, 'x')) || 0;
            const currentY = parseFloat(gsap.getProperty(btn, 'y')) || 0;
            
            gsap.to(btn, { 
                x: currentX + newX, 
                y: currentY + newY, 
                rotation: (Math.random() - 0.5) * 30,
                duration: 0.25, 
                ease: 'power2.out' 
            });
            
            // Update text
            btn.textContent = noTexts[Math.min(noIdx++, noTexts.length - 1)];
            
            // Play a small sound
            playTone(300 + noIdx * 50, 0.1, 'sine', 0.1);
            
            // Make yes button grow slightly to encourage clicking it
            gsap.to('#yes-btn', { scale: 1 + noIdx * 0.05, duration: 0.2 });
            
            // After many attempts, make the button shrink and fade
            if (noIdx >= noTexts.length) {
                gsap.to(btn, { 
                    opacity: 0.3, 
                    scale: 0.7, 
                    duration: 0.5,
                    ease: 'power2.out'
                });
            }
        };
        
        // If they somehow click it, show a funny reaction
        noBtn.onclick = function(e) {
            noClickCount++;
            e.stopPropagation();
            
            // Shake the button
            gsap.to(noBtn, { x: '+=10', duration: 0.05, yoyo: true, repeat: 5 });
            
            if (noClickCount >= 3) {
                // After 3 clicks, the button "gives up"
                gsap.to(noBtn, { 
                    scale: 0, 
                    rotation: 720, 
                    opacity: 0, 
                    duration: 0.5,
                    ease: 'power2.in',
                    onComplete: () => {
                        noBtn.style.display = 'none';
                        // Make yes button bigger
                        gsap.to('#yes-btn', { scale: 1.3, duration: 0.3 });
                        sparkle(e.clientX, e.clientY, 15);
                    }
                });
                playTone(100, 0.3, 'sawtooth', 0.1); // Sad sound
            } else {
                // Show a message
                const messages = ['Haha non!', 'Essaie encore!', 'Pas possible!'];
                const popup = document.createElement('div');
                popup.textContent = messages[noClickCount - 1];
                popup.style.cssText = `
                    position: fixed;
                    left: ${e.clientX}px;
                    top: ${e.clientY}px;
                    font-family: 'Quicksand', sans-serif;
                    font-size: 1.5rem;
                    color: #ff6b6b;
                    font-weight: bold;
                    pointer-events: none;
                    z-index: 1000;
                    text-shadow: 2px 2px 0 #fff;
                `;
                document.body.appendChild(popup);
                gsap.fromTo(popup, 
                    { scale: 0, y: 0 }, 
                    { scale: 1, y: -50, opacity: 0, duration: 1, ease: 'power2.out', onComplete: () => popup.remove() }
                );
            }
        };

        // Show is now started by the intro screen "Commencer" button
        // window.onload = () => setTimeout(runShow, 600);
    </script>
</body>
</html>
