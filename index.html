<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Kanto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:wght@400;600;700;900&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --pink: #ff6b9d;
            --pink-light: #ffc2d1;
            --pink-dark: #e84a7f;
            --gold: #ffd700;
            --purple: #9b59b6;
            --dark: #030305;
            --red: #ff3333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--dark);
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        #stage {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: var(--dark);
        }

        .bar { position: fixed; left: 0; width: 100%; height: 0%; background: #000; z-index: 1000; display: none; }
        .bar.top { top: 0; }
        .bar.bottom { bottom: 0; }

        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 900; pointer-events: none; }
        #red-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--red); opacity: 0; z-index: 899; pointer-events: none; }

        .ambient {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200vmax; height: 200vmax;
            border-radius: 50%;
            pointer-events: none !important;
            z-index: 5;
            opacity: 0;
        }

        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none !important; }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.7) 100%);
            pointer-events: none !important; z-index: 10;
        }

        .slide {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding: 40px;
            opacity: 0; z-index: 100; pointer-events: none;
        }
        .slide.active { opacity: 1; pointer-events: auto !important; }

        .narrator {
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            color: rgba(255,255,255,0.9);
            letter-spacing: 3px;
            position: absolute;
            opacity: 0;
        }
        .narrator.top { top: 18%; }
        .narrator.bottom { bottom: 18%; }
        .narrator .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: rgba(255,255,255,0.8);
            margin-left: 4px;
            animation: cursorBlink 0.7s step-end infinite;
        }
        @keyframes cursorBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        .mega-title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(4rem, 15vw, 12rem);
            line-height: 1.1;
        }

        .title-row { display: flex; align-items: center; gap: 25px; }

        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(50px);
            position: relative;
        }

        .letter.hit {
            animation: hitShake 0.3s ease;
        }

        @keyframes hitShake {
            0%, 100% { transform: translateX(0) rotate(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }

        .letter.damaged { 
            color: #666 !important; 
            text-shadow: none !important;
            filter: blur(1px);
        }

        .letter.cracked {
            color: #444 !important;
            opacity: 0.6 !important;
            filter: blur(2px);
        }

        .letter.destroyed {
            opacity: 0 !important;
            transform: scale(0) rotate(180deg) !important;
        }

        .white { color: white; text-shadow: 0 0 30px rgba(255,255,255,0.3); }
        .gray { color: #888; }
        .pink { color: var(--pink); text-shadow: 0 0 40px var(--pink), 0 0 80px var(--pink); }
        .gold { color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.6); }

        .crown {
            font-size: clamp(4rem, 10vw, 8rem);
            color: var(--gold);
            opacity: 0;
            transform: translateY(-100px) scale(0);
            filter: drop-shadow(0 0 30px rgba(255,215,0,0.8));
            margin-bottom: 20px;
        }

        .subtitle-line { width: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 25px 0; }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            color: var(--gold);
            letter-spacing: 10px;
            text-transform: uppercase;
            opacity: 0;
        }

        /* Chess Attackers */
        .attacker {
            position: fixed;
            font-size: 4rem;
            z-index: 200;
            opacity: 0;
            filter: drop-shadow(0 0 15px currentColor);
            transition: filter 0.2s;
        }

        .attacker.charging {
            animation: charging 0.3s ease infinite;
        }

        @keyframes charging {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .attacker.striking {
            filter: drop-shadow(0 0 30px currentColor) drop-shadow(0 0 50px white);
        }

        /* Impact effects */
        .hit-spark {
            position: fixed;
            width: 8px; height: 8px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 250;
        }

        .crack-line {
            position: fixed;
            height: 3px;
            background: rgba(255,255,255,0.8);
            z-index: 240;
            transform-origin: left center;
            pointer-events: none;
        }

        .slash-effect {
            position: fixed;
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), white, var(--gold), transparent);
            z-index: 260;
            pointer-events: none;
            opacity: 0;
        }

        /* Damage number popup */
        .damage-popup {
            position: fixed;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            color: var(--red);
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            z-index: 300;
        }

        .sparkle { position: fixed; pointer-events: none; z-index: 500; }
        .heart-p { position: fixed; pointer-events: none; z-index: 500; color: var(--pink); }
        .frag {
            position: fixed;
            font-family: 'Pacifico', cursive;
            font-size: clamp(3rem, 10vw, 8rem);
            color: #444;
            z-index: 200;
            pointer-events: none;
        }

        .shockwave {
            position: fixed;
            border: 3px solid var(--pink);
            border-radius: 50%;
            z-index: 155;
            opacity: 0;
            pointer-events: none;
        }

        .rising-hearts {
            position: fixed; bottom: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none !important; z-index: 45; overflow: hidden;
        }

        .rising-heart {
            position: absolute; bottom: -50px;
            color: var(--pink); opacity: 0.6;
            animation: riseUp 4s ease-out forwards;
        }

        @keyframes riseUp { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

        /* Other scenes styling */
        .elegant-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 6vw, 4.5rem); font-weight: 700; }
        .script-title { font-family: 'Pacifico', cursive; font-size: clamp(2.5rem, 8vw, 6rem); }

        .bubble {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 25px; padding: 25px 40px;
            max-width: 650px; margin: 15px 0;
            opacity: 0; transform: translateY(20px);
            backdrop-filter: blur(5px);
        }
        .bubble p { font-size: clamp(1rem, 2.5vw, 1.3rem); line-height: 1.8; }
        .bubble .hl { color: var(--pink); font-weight: 700; }

        .pieces-row { display: flex; gap: 15px; margin: 30px 0; }
        .piece-icon { font-size: clamp(2rem, 5vw, 3.5rem); opacity: 0; transform: translateY(30px); }

        .heart-container { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; }
        .big-heart { font-size: 6rem; color: var(--pink); z-index: 2; }
        .heart-ring { position: absolute; width: 100%; height: 100%; border: 3px solid var(--pink); border-radius: 50%; opacity: 0; }

        .letter-grid { display: flex; gap: 8px; justify-content: center; }
        .letter-box {
            width: clamp(45px, 12vw, 75px); height: clamp(45px, 12vw, 75px);
            background: rgba(255,255,255,0.05); border: 2px solid var(--pink);
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-family: 'Pacifico', cursive; font-size: clamp(1.8rem, 5vw, 3rem);
            color: var(--pink); opacity: 0; transform: scale(0) rotate(-180deg);
        }

        .chess-board-3d {
            display: grid; grid-template-columns: repeat(8, 1fr);
            gap: 2px; padding: 10px; background: rgba(0,0,0,0.5);
            border-radius: 10px; transform: perspective(800px) rotateX(15deg);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .sq {
            width: clamp(28px, 6vw, 45px); height: clamp(28px, 6vw, 45px);
            display: flex; justify-content: center; align-items: center;
            font-size: clamp(0.9rem, 2vw, 1.4rem); border-radius: 4px;
            opacity: 0; transform: scale(0);
        }
        .sq.w { background: rgba(255,255,255,0.9); color: var(--pink-dark); }
        .sq.b { background: var(--pink); color: white; }

        .btn-container { 
            display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; margin-top: 40px; 
            position: relative;
            z-index: 500;
            pointer-events: none;
        }
        .btn {
            padding: 20px 55px; border-radius: 50px; border: none;
            font-size: 1.4rem; font-weight: 700; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-family: 'Quicksand', sans-serif;
            opacity: 0; transform: translateY(30px);
            position: relative;
            z-index: 501;
            pointer-events: none;
        }
        .btn.active {
            pointer-events: auto;
        }
        .btn:hover { transform: translateY(-5px) scale(1.05); }
        .btn-yes { background: linear-gradient(135deg, #7dd3b0, #4ecdc4); color: white; box-shadow: 0 15px 40px rgba(125,211,176,0.4); }
        .btn-no { background: linear-gradient(135deg, #ff8a8a, #ff6b6b); color: white; box-shadow: 0 15px 40px rgba(255,138,138,0.4); }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .bar { height: 6%; }
            .mega-title { font-size: clamp(2.5rem, 12vw, 6rem); }
            .narrator { font-size: clamp(0.9rem, 3vw, 1.2rem); letter-spacing: 2px; padding: 0 20px; }
            .narrator.top { top: 12%; }
            .narrator.bottom { bottom: 12%; }
            .crown { font-size: clamp(2.5rem, 8vw, 4rem); }
            .bubble { padding: 15px 25px; margin: 10px 15px; border-radius: 18px; }
            .bubble p { font-size: clamp(0.85rem, 2.5vw, 1.1rem); line-height: 1.6; }
            .elegant-title { font-size: clamp(1.5rem, 5vw, 2.5rem); }
            .script-title { font-size: clamp(2rem, 7vw, 4rem); }
            .pieces-row { gap: 8px; }
            .piece-icon { font-size: clamp(1.5rem, 4vw, 2.5rem); }
            .btn { padding: 15px 40px; font-size: 1.1rem; }
            .btn-container { gap: 15px; }
            .chess-board-3d { transform: perspective(800px) rotateX(10deg) scale(0.9); }
            .sq { width: clamp(22px, 5vw, 35px); height: clamp(22px, 5vw, 35px); font-size: clamp(0.7rem, 1.5vw, 1rem); }
            .letter-box { width: clamp(35px, 10vw, 55px); height: clamp(35px, 10vw, 55px); font-size: clamp(1.4rem, 4vw, 2rem); }
            .attacker { font-size: 2.5rem; }
            .heart-container { width: 150px; height: 150px; }
            .big-heart { font-size: 4rem; }
            #success h1 { font-size: clamp(2.5rem, 12vw, 6rem); }
            #success .love-text { font-size: clamp(1.2rem, 3.5vw, 1.8rem); }
            #success .hearts-row { font-size: 2rem; gap: 15px; }
            .slide { padding: 20px; }
            .title-row { gap: 10px; }
        }

        @media (max-width: 480px) {
            .bar { height: 5%; }
            .mega-title { font-size: clamp(2rem, 10vw, 4rem); }
            .narrator.top { top: 10%; }
            .narrator.bottom { bottom: 10%; }
            .bubble { padding: 12px 18px; }
            .attacker { font-size: 2rem; }
            .chess-board-3d { transform: perspective(800px) rotateX(5deg) scale(0.8); gap: 1px; padding: 5px; }
        }

        /* Touch device optimization */
        @media (hover: none) {
            .btn:hover { transform: none; }
            .btn:active { transform: scale(0.95); }
        }

        #success {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff8fab 0%, #ffc2d1 50%, #e0c3fc 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            overflow: hidden;
        }
        #success.active { display: flex; }
        #success .success-crown { font-size: 4rem; color: var(--gold); margin-bottom: 20px; opacity: 0; animation: crownBounce 1s ease infinite; animation-delay: 1s; }
        @keyframes crownBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #success h1 { font-family: 'Pacifico'; font-size: clamp(4rem, 15vw, 10rem); color: white; text-shadow: 4px 4px 0 var(--pink-dark), 0 0 40px rgba(255,255,255,0.5); opacity: 0; }
        #success .love-text { font-size: clamp(1.5rem, 4vw, 2.5rem); color: white; margin: 20px 0; opacity: 0; text-shadow: 2px 2px 0 var(--pink-dark); }
        #success .hearts-row { display: flex; gap: 20px; font-size: 3rem; color: white; opacity: 0; }
        #success .hearts-row i { animation: heartPulse 0.8s ease infinite; }
        #success .hearts-row i:nth-child(2) { animation-delay: 0.2s; }
        #success .hearts-row i:nth-child(3) { animation-delay: 0.4s; }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        #success .final-message { font-size: 1.2rem; color: rgba(255,255,255,0.9); margin-top: 30px; opacity: 0; }
        
        /* Falling hearts in success screen */
        .falling-heart {
            position: fixed;
            top: -50px;
            color: rgba(255,255,255,0.6);
            animation: fallDown linear forwards;
            pointer-events: none;
            z-index: 9998;
        }
        @keyframes fallDown {
            to { transform: translateY(110vh) rotate(360deg); }
        }
        
        /* Firework effect */
        .firework {
            position: fixed;
            width: 6px; height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
        }
        
        /* Floating chess pieces in success */
        .floating-piece {
            position: fixed;
            opacity: 0.15;
            color: white;
            pointer-events: none;
            z-index: 9997;
            animation: floatPiece 8s ease-in-out infinite;
        }
        @keyframes floatPiece {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }
        
        /* Glowing orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
            z-index: 9996;
            animation: orbFloat 6s ease-in-out infinite;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.2); }
        }

        /* Audio toggle button */
        #audio-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 2000;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        #audio-toggle:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        #audio-toggle.muted {
            opacity: 0.5;
        }
        #audio-toggle .sound-waves {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            animation: soundWave 1.5s ease-out infinite;
            pointer-events: none;
        }
        @keyframes soundWave {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        /* Floating chess pieces background */
        .bg-chess-piece {
            position: fixed;
            opacity: 0.03;
            color: white;
            pointer-events: none;
            z-index: 1;
            animation: floatBgPiece 20s ease-in-out infinite;
        }
        @keyframes floatBgPiece {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(10px) rotate(-3deg); }
            75% { transform: translateY(-15px) rotate(8deg); }
        }

        /* Letter carrier floating */
        @keyframes letterFloat {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        /* Kanto letters for piece delivery */
        .kanto-letter-slot {
            display: inline-block;
            min-width: clamp(2rem, 8vw, 5rem);
            opacity: 0;
        }
        .kanto-letter-slot.revealed {
            opacity: 1;
            animation: letterReveal 0.5s ease-out;
        }
        @keyframes letterReveal {
            0% { transform: scale(1.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Love Reasons Scene */
        .love-reasons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 600px;
        }
        .love-title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: var(--pink);
            margin-bottom: 20px;
            opacity: 0;
            text-shadow: 0 0 30px var(--pink);
        }
        .love-title i { margin: 0 15px; animation: heartPulse 1s ease infinite; }
        .reason-item {
            background: rgba(255,107,157,0.1);
            border: 1px solid rgba(255,107,157,0.3);
            border-radius: 50px;
            padding: 15px 30px;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: white;
            opacity: 0;
            transform: translateX(-50px);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .reason-item i { color: var(--gold); }

        /* Promises Scene */
        .promises-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        .promise-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            color: var(--gold);
            margin-bottom: 15px;
            opacity: 0;
        }
        .promise-title i { margin-right: 15px; }
        .promise-item {
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transform: scale(0.8);
        }
        .promise-icon {
            font-size: 2.5rem;
            color: var(--pink);
            filter: drop-shadow(0 0 10px var(--pink));
            animation: iconFloat 2s ease-in-out infinite;
        }
        .promise-item:nth-child(2) .promise-icon { animation-delay: 0.2s; }
        .promise-item:nth-child(3) .promise-icon { animation-delay: 0.4s; }
        .promise-item:nth-child(4) .promise-icon { animation-delay: 0.6s; }
        .promise-item:nth-child(5) .promise-icon { animation-delay: 0.8s; }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .promise-item span {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: white;
        }

        /* Poem Scene */
        .poem-container {
            text-align: center;
            max-width: 600px;
        }
        .poem-line {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: white;
            line-height: 2;
            opacity: 0;
            transform: translateY(20px);
            font-style: italic;
        }
        .poem-line:nth-child(odd) { color: var(--pink-light); }
        .poem-signature {
            font-family: 'Pacifico', cursive;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            color: var(--gold);
            margin-top: 30px;
            opacity: 0;
        }
        .poem-signature i { margin-left: 8px; }

        /* Constellation Scene */
        #constellation-canvas,
        #knight-journey-canvas,
        #queen-transform-canvas,
        #particle-hearts-canvas,
        #magic-book-canvas,
        #poem-canvas,
        #chess-heart-canvas,
        #name-magic-canvas,
        #gift-hint-canvas,
        #apple-scene-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .constellation-text {
            position: relative;
            z-index: 2;
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: rgba(255,255,255,0.9);
            letter-spacing: 3px;
            opacity: 0;
            margin-top: 50px;
        }
        
        /* Overlay texts for canvas scenes */
        .reasons-overlay, .promise-overlay {
            position: absolute;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .overlay-text {
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: white;
            text-shadow: 0 0 20px rgba(255,107,157,0.8);
            opacity: 0;
            transform: translateY(20px);
        }

        /* ==================== INTRO SCREEN ==================== */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #030305 0%, #0a0a15 50%, #030305 100%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #intro-screen.hidden {
            pointer-events: none;
        }

        /* Starfield background */
        .intro-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .intro-star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: starTwinkle 2s ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Floating particles */
        .intro-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .intro-particle.gold {
            background: radial-gradient(circle, #ffd700 0%, rgba(255,215,0,0) 70%);
            animation: floatParticle 8s ease-in-out infinite;
        }

        .intro-particle.pink {
            background: radial-gradient(circle, #ff6b9d 0%, rgba(255,107,157,0) 70%);
            animation: floatParticle 10s ease-in-out infinite reverse;
        }

        .intro-particle.white {
            background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0) 70%);
            animation: floatParticle 6s ease-in-out infinite;
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.5; }
            25% { transform: translateY(-30px) translateX(15px) scale(1.2); opacity: 0.8; }
            50% { transform: translateY(-10px) translateX(-10px) scale(0.9); opacity: 0.6; }
            75% { transform: translateY(-40px) translateX(-20px) scale(1.1); opacity: 0.9; }
        }

        /* Floating hearts */
        .intro-heart {
            position: absolute;
            color: var(--pink);
            opacity: 0.3;
            animation: floatHeart 12s ease-in-out infinite;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            33% { transform: translateY(-50px) rotate(15deg) scale(1.1); }
            66% { transform: translateY(-20px) rotate(-10deg) scale(0.95); }
        }

        /* Glowing orbs */
        .intro-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: orbPulse 6s ease-in-out infinite;
        }

        .intro-orb.orb-1 {
            width: 400px;
            height: 400px;
            background: var(--pink);
            top: -100px;
            left: -100px;
        }

        .intro-orb.orb-2 {
            width: 300px;
            height: 300px;
            background: var(--gold);
            bottom: -50px;
            right: -50px;
            animation-delay: 2s;
        }

        .intro-orb.orb-3 {
            width: 250px;
            height: 250px;
            background: var(--purple);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }

        @keyframes orbPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* Title container */
        .intro-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
        }

        /* Small decorative text */
        .intro-pretext {
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: rgba(255,255,255,0.7);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0;
        }

        /* Main title */
        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .intro-title-line {
            display: block;
            opacity: 0;
            transform: translateY(30px);
        }

        .intro-title-line.line-1 {
            color: rgba(255,255,255,0.9);
        }

        .intro-title-line.line-2 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(3rem, 10vw, 7rem);
            background: linear-gradient(135deg, var(--pink) 0%, var(--gold) 50%, var(--pink-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(255,107,157,0.5));
        }

        .intro-title-line.line-3 {
            color: rgba(255,255,255,0.9);
        }

        /* Decorative line */
        .intro-line {
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 30px auto;
        }

        /* Subtitle */
        .intro-subtitle {
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: rgba(255,255,255,0.6);
            letter-spacing: 4px;
            margin-bottom: 50px;
            opacity: 0;
        }

        /* Start button */
        .intro-btn {
            position: relative;
            padding: 18px 60px;
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(1rem, 2vw, 1.3rem);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: white;
            background: transparent;
            border: 2px solid var(--gold);
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        .intro-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
            transition: left 0.5s ease;
        }

        .intro-btn:hover::before {
            left: 100%;
        }

        .intro-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: var(--gold);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
            z-index: -1;
        }

        .intro-btn:hover {
            color: #030305;
            border-color: var(--gold);
            box-shadow: 0 0 40px rgba(255,215,0,0.5), 0 0 80px rgba(255,215,0,0.3);
        }

        .intro-btn:hover::after {
            width: 400px;
            height: 400px;
        }

        .intro-btn i {
            margin-left: 10px;
            transition: transform 0.3s ease;
        }

        .intro-btn:hover i {
            transform: translateX(5px);
        }

        /* Button glow rings */
        .btn-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid var(--gold);
            border-radius: 50px;
            opacity: 0;
            pointer-events: none;
        }

        /* Corner decorations */
        .intro-corner {
            position: absolute;
            width: 80px;
            height: 80px;
            opacity: 0;
        }

        .intro-corner.top-left {
            top: 30px;
            left: 30px;
            border-top: 2px solid var(--gold);
            border-left: 2px solid var(--gold);
        }

        .intro-corner.top-right {
            top: 30px;
            right: 30px;
            border-top: 2px solid var(--gold);
            border-right: 2px solid var(--gold);
        }

        .intro-corner.bottom-left {
            bottom: 30px;
            left: 30px;
            border-bottom: 2px solid var(--gold);
            border-left: 2px solid var(--gold);
        }

        .intro-corner.bottom-right {
            bottom: 30px;
            right: 30px;
            border-bottom: 2px solid var(--gold);
            border-right: 2px solid var(--gold);
        }

        /* Transition overlay */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            pointer-events: none;
            display: none;
        }

        .transition-slice {
            position: absolute;
            width: 100%;
            background: var(--dark);
        }

        /* Shockwave effect for transition */
        .intro-shockwave {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            opacity: 0;
            pointer-events: none;
            z-index: 10001;
        }

        /* ==================== RESPONSIVE STYLES ==================== */

    <script>
        // ==================== INTRO SCREEN SYSTEM ====================
        let backgroundMusic = null;
        let introAnimationComplete = false;

        function createIntroElements() {
            // Create stars
            const starsContainer = document.getElementById('intro-stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'intro-star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (1 + Math.random() * 2) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 2) + 's';
                starsContainer.appendChild(star);
            }

            // Create floating particles
            const particlesContainer = document.getElementById('intro-particles');
            const particleTypes = ['gold', 'pink', 'white'];
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'intro-particle ' + particleTypes[i % 3];

        function playTone(frequency, duration, type = 'sine', volume = 0.3) {
            if (!audioEnabled) return;
            try {
                const ctx = initAudio();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                gainNode.gain.setValueAtTime(volume, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        class Particle {
            constructor(x, y, color, speed = 10, size = 3) {
                this.x = x; this.y = y; this.color = color;

                this.vy = (Math.random() - 0.5) * speed;

            draw() { ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.life > 0);

            ctx.globalAlpha = 1;

        // ==================== CONSTELLATION HEART ====================
        function drawConstellationHeart() {
            const canvas = document.getElementById('constellation-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 - 50;
            const scale = Math.min(canvas.width, canvas.height) * 0.003;
            
            // Heart shape points
            const heartPoints = [];
            for (let t = 0; t < Math.PI * 2; t += 0.3) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                heartPoints.push({ x: cx + x * scale * 8, y: cy + y * scale * 8 });
            }
            
            // Random stars in background
            const bgStars = [];
            for (let i = 0; i < 100; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
            
            let currentPoint = 0;
            let lineProgress = 0;
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw background stars with twinkle
                bgStars.forEach(star => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha + Math.sin(Date.now() / 500 + star.x) * 0.2})`;
                    ctx.fill();
                });
                
                // Draw revealed heart points
                for (let i = 0; i <= currentPoint && i < heartPoints.length; i++) {
                    const p = heartPoints[i];
                    
                    // Glowing star point
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffd700';
                    ctx.fill();
                    
                    // Connect lines
                    if (i > 0) {
                        const prev = heartPoints[i - 1];
                        ctx.beginPath();
                        ctx.moveTo(prev.x, prev.y);
                        if (i === currentPoint) {
                            // Animate current line
                            const tx = prev.x + (p.x - prev.x) * lineProgress;
                            const ty = prev.y + (p.y - prev.y) * lineProgress;
                            ctx.lineTo(tx, ty);
                        } else {
                            ctx.lineTo(p.x, p.y);
                        }
                        ctx.strokeStyle = 'rgba(255, 107, 157, 0.6)';
                        ctx.lineWidth = 2;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#ff6b9d';
                        ctx.stroke();
                    }
                }
                ctx.shadowBlur = 0;
                
                // Progress animation
                lineProgress += 0.08;
                if (lineProgress >= 1) {
                    lineProgress = 0;
                    currentPoint++;
                    if (currentPoint < heartPoints.length) {
                        playTone(400 + currentPoint * 20, 0.1, 'sine', 0.1);
                    }
                }
                
                // Close the heart
                if (currentPoint >= heartPoints.length && heartPoints.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(heartPoints[heartPoints.length - 1].x, heartPoints[heartPoints.length - 1].y);
                    ctx.lineTo(heartPoints[0].x, heartPoints[0].y);
                    ctx.strokeStyle = 'rgba(255, 107, 157, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                
                if (currentPoint < heartPoints.length + 10) {
                    requestAnimationFrame(animate);
                }
            }
            
            animate();
        }
