        // ==================== SCENE 3: KNIGHT JOURNEY ====================
        function drawKnightJourney() {
            const canvas = document.getElementById('knight-journey-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Calculate board dimensions to fit nicely
            const boardSize = Math.min(canvas.width, canvas.height) * 0.7;
            const cellSize = boardSize / 8;
            const boardX = (canvas.width - boardSize) / 2;
            const boardY = (canvas.height - boardSize) / 2;
            
            // Knight path - L-shaped moves toward the queen
            const path = [
                {x: 1, y: 7}, {x: 2, y: 5}, {x: 3, y: 7}, {x: 4, y: 5},
                {x: 5, y: 3}, {x: 4, y: 1}, {x: 3, y: 3}, {x: 4, y: 5},
                {x: 3, y: 3}, {x: 4, y: 4}
            ];
            
            // Queen position
            const queenPos = { x: 3, y: 3 };
            
            let currentStep = 0;
            let animProgress = 0;
            let trailPoints = [];
            let startTime = Date.now();
            let animationId = null;
            
            // Easing function for smooth movement
            function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }
            
            // Convert grid position to canvas coordinates
            function gridToCanvas(gx, gy) {
                return {
                    x: boardX + gx * cellSize + cellSize / 2,
                    y: boardY + gy * cellSize + cellSize / 2
                };
            }
            
            function drawBoard() {
                // Draw chessboard with subtle gradient
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const isLight = (r + c) % 2 === 0;
                        ctx.fillStyle = isLight ? 'rgba(255, 255, 255, 0.08)' : 'rgba(255, 107, 157, 0.08)';
                        ctx.fillRect(boardX + c * cellSize, boardY + r * cellSize, cellSize, cellSize);
                        
                        // Cell border
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(boardX + c * cellSize, boardY + r * cellSize, cellSize, cellSize);
                    }
                }
            }
            
            function drawQueen() {
                const pos = gridToCanvas(queenPos.x, queenPos.y);
                const time = Date.now() / 1000;
                const pulse = 1 + Math.sin(time * 2) * 0.05;
                
                // Glow effect
                const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, cellSize * 0.8);
                gradient.addColorStop(0, 'rgba(255, 107, 157, 0.4)');
                gradient.addColorStop(1, 'rgba(255, 107, 157, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, cellSize * 0.8, 0, Math.PI * 2);
                ctx.fill();
                
                // Queen emoji/symbol
                ctx.font = `${cellSize * 0.6 * pulse}px Arial`;
                ctx.fillStyle = '#ff6b9d';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('♛', pos.x, pos.y);
            }
            
            function drawTrail() {
                if (trailPoints.length < 2) return;
                
                ctx.beginPath();
                ctx.moveTo(trailPoints[0].x, trailPoints[0].y);
                
                for (let i = 1; i < trailPoints.length; i++) {
                    ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
                }
                
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                
                // Draw dots at each visited position
                trailPoints.forEach((p, i) => {
                    const alpha = 0.3 + (i / trailPoints.length) * 0.5;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
                    ctx.fill();
                });
            }
            
            function drawKnight(x, y, jumpHeight = 0) {
                // Shadow
                ctx.beginPath();
                ctx.ellipse(x, y + cellSize * 0.3, cellSize * 0.25, cellSize * 0.1, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                // Glow effect
                const gradient = ctx.createRadialGradient(x, y - jumpHeight, 0, x, y - jumpHeight, cellSize * 0.6);
                gradient.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
                gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y - jumpHeight, cellSize * 0.6, 0, Math.PI * 2);
                ctx.fill();
                
                // Knight symbol
                ctx.font = `${cellSize * 0.55}px Arial`;
                ctx.fillStyle = '#ffd700';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('♞', x, y - jumpHeight);
            }
            
            function animate() {
                // Clear with solid background for smooth rendering
                ctx.fillStyle = '#030305';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                drawBoard();
                drawQueen();
                drawTrail();
                
                if (currentStep < path.length - 1) {
                    const from = gridToCanvas(path[currentStep].x, path[currentStep].y);
                    const to = gridToCanvas(path[currentStep + 1].x, path[currentStep + 1].y);
                    
                    // Smooth eased progress
                    const easedProgress = easeInOutCubic(animProgress);
                    
                    // Current position with interpolation
                    const currentX = from.x + (to.x - from.x) * easedProgress;
                    const currentY = from.y + (to.y - from.y) * easedProgress;
                    
                    // Jump arc - knight jumps during movement
                    const jumpHeight = Math.sin(animProgress * Math.PI) * cellSize * 0.5;
                    
                    drawKnight(currentX, currentY, jumpHeight);
                    
                    // Progress animation (slower, smoother)
                    animProgress += 0.012;
                    
                    if (animProgress >= 1) {
                        animProgress = 0;
                        currentStep++;
                        
                        // Add point to trail
                        if (currentStep < path.length) {
                            const newPos = gridToCanvas(path[currentStep].x, path[currentStep].y);
                            trailPoints.push(newPos);
                        }
                        
                        // Play subtle sound
                        playTone(400 + currentStep * 30, 0.15, 'sine', 0.08);
                    }
                } else {
                    // Knight at final position - continuous floating animation
                    const finalPos = gridToCanvas(path[path.length - 1].x, path[path.length - 1].y);
                    const time = Date.now() / 1000;
                    
                    // Gentle floating up and down
                    const hover = Math.sin(time * 2.5) * 8;
                    
                    // Slight horizontal sway
                    const sway = Math.sin(time * 1.5) * 3;
                    
                    drawKnight(finalPos.x + sway, finalPos.y, hover);
                    
                    // Draw a little heart appearing occasionally near the knight
                    const heartPhase = (time * 0.5) % 1;
                    if (heartPhase < 0.3) {
                        ctx.font = '16px Arial';
                        ctx.fillStyle = `rgba(255, 107, 157, ${1 - heartPhase / 0.3})`;
                        ctx.textAlign = 'center';
                        ctx.fillText('♥', finalPos.x + 30, finalPos.y - 30 - heartPhase * 50);
                    }
                }
                
                // Continue animation for 8 seconds total (matches timeline)
                if (Date.now() - startTime < 8000) {
                    animationId = requestAnimationFrame(animate);
                }
            }
            
            // Initialize with first point
            trailPoints.push(gridToCanvas(path[0].x, path[0].y));
            animate();
        }

        // ==================== SCENE 4: QUEEN TRANSFORMATION ====================
        function drawQueenTransform() {
            const canvas = document.getElementById('queen-transform-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            let startTime = Date.now();
            let animationId = null;
            
            // Particles orbiting around the queen
            const particles = [];
            const numParticles = 60;
            
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    angle: (Math.PI * 2 / numParticles) * i,
                    radius: 100 + Math.random() * 150,
                    baseRadius: 100 + Math.random() * 150,
                    speed: 0.008 + Math.random() * 0.012,
                    size: 2 + Math.random() * 4,
                    color: Math.random() > 0.5 ? '#ff6b9d' : '#ffd700',
                    offset: Math.random() * Math.PI * 2
                });
            }
            
            // Sparkle particles that appear during transformation
            const sparkles = [];
            
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }
            
            function easeInOutSine(t) {
                return -(Math.cos(Math.PI * t) - 1) / 2;
            }
            
            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                const duration = 6;
                const progress = Math.min(elapsed / duration, 1);
                
                // Clear with solid color for smooth rendering
                ctx.fillStyle = '#030305';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Phase calculations
                const phase1End = 0.4; // Particles orbiting
                const phase2End = 0.7; // Particles spiral in
                const phase3End = 1.0; // Queen fully revealed
                
                // Draw ambient glow
                const glowSize = 150 + progress * 100;
                const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowSize);
                gradient.addColorStop(0, `rgba(255, 107, 157, ${0.2 + progress * 0.2})`);
                gradient.addColorStop(0.5, `rgba(255, 107, 157, ${0.1 * (1 - progress)})`);
                gradient.addColorStop(1, 'rgba(255, 107, 157, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(cx, cy, glowSize, 0, Math.PI * 2);
                ctx.fill();
                
                // Update and draw particles
                particles.forEach((p, i) => {
                    // Update angle
                    p.angle += p.speed;
                    
                    // Calculate current radius based on phase
                    let targetRadius = p.baseRadius;
                    if (progress > phase1End) {
                        const spiralProgress = Math.min((progress - phase1End) / (phase2End - phase1End), 1);
                        targetRadius = p.baseRadius * (1 - easeInOutSine(spiralProgress) * 0.85);
                    }
                    
                    // Smooth radius transition
                    p.radius += (targetRadius - p.radius) * 0.05;
                    
                    // Calculate position with slight wave motion
                    const waveOffset = Math.sin(elapsed * 2 + p.offset) * 5;
                    const x = cx + Math.cos(p.angle) * (p.radius + waveOffset);
                    const y = cy + Math.sin(p.angle) * (p.radius + waveOffset);
                    
                    // Draw particle with glow
                    const particleAlpha = progress > phase2End ? (1 - (progress - phase2End) / (phase3End - phase2End)) : 1;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = particleAlpha * 0.8;
                    ctx.fill();
                    
                    // Subtle glow around each particle
                    ctx.beginPath();
                    ctx.arc(x, y, p.size * 2, 0, Math.PI * 2);
                    const pGradient = ctx.createRadialGradient(x, y, 0, x, y, p.size * 2);
                    pGradient.addColorStop(0, p.color);
                    pGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = pGradient;
                    ctx.globalAlpha = particleAlpha * 0.3;
                    ctx.fill();
                });
                
                ctx.globalAlpha = 1;
                
                // Draw the queen - grows as animation progresses
                const queenProgress = progress > 0.2 ? Math.min((progress - 0.2) / 0.6, 1) : 0;
                const queenSize = easeOutCubic(queenProgress) * 80 + 20;
                const queenAlpha = easeOutCubic(queenProgress);
                
                if (queenProgress > 0) {
                    // Queen glow
                    const queenGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, queenSize * 1.5);
                    queenGlow.addColorStop(0, `rgba(255, 107, 157, ${queenAlpha * 0.5})`);
                    queenGlow.addColorStop(1, 'rgba(255, 107, 157, 0)');
                    ctx.fillStyle = queenGlow;
                    ctx.beginPath();
                    ctx.arc(cx, cy, queenSize * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Queen symbol
                    ctx.font = `${queenSize}px Arial`;
                    ctx.fillStyle = `rgba(255, 107, 157, ${queenAlpha})`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('♛', cx, cy);
                }
                
                // Draw text when queen is mostly visible
                if (progress > 0.6) {
                    const textProgress = (progress - 0.6) / 0.4;
                    const textAlpha = easeOutCubic(textProgress);
                    const textY = cy + queenSize + 50 + (1 - textAlpha) * 20;
                    
                    ctx.font = 'bold 28px Quicksand, sans-serif';
                    ctx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
                    ctx.textAlign = 'center';
                    ctx.fillText('Tu es ma Reine', cx, textY);
                }
                
                // Add sparkles periodically
                if (progress > 0.3 && progress < 0.9 && Math.random() > 0.9) {
                    sparkles.push({
                        x: cx + (Math.random() - 0.5) * 200,
                        y: cy + (Math.random() - 0.5) * 200,
                        size: 2 + Math.random() * 3,
                        life: 1
                    });
                }
                
                // Update and draw sparkles
                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const s = sparkles[i];
                    s.life -= 0.03;
                    
                    if (s.life <= 0) {
                        sparkles.splice(i, 1);
                        continue;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 215, 0, ${s.life})`;
                    ctx.fill();
                }
                
                // Continue animation
                if (elapsed < duration + 0.5) {
                    animationId = requestAnimationFrame(animate);
                }
            }
            
            animate();
        }

        // ==================== SCENE 4B: PARTICLE HEARTS ====================
        function drawParticleHearts() {
            const canvas = document.getElementById('particle-hearts-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            const reasons = [
                "Ton sourire",
                "Ta gentillesse", 
                "Ton intelligence",
                "Ta beaute",
                "Ton humour",
                "Ton amour"
            ];
            
            let startTime = Date.now();
            let currentReasonIndex = -1;
            let reasonOpacity = 0;
            let animationId = null;
            
            // Floating hearts with better properties
            const hearts = [];
            const numHearts = 40;
            
            for (let i = 0; i < numHearts; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height + Math.random() * 100,
                    size: 15 + Math.random() * 25,
                    speedY: 0.5 + Math.random() * 1.5,
                    speedX: (Math.random() - 0.5) * 0.5,
                    wobbleSpeed: 0.02 + Math.random() * 0.02,
                    wobbleAmount: 20 + Math.random() * 30,
                    phase: Math.random() * Math.PI * 2,
                    opacity: 0.4 + Math.random() * 0.4,
                    pulseSpeed: 0.03 + Math.random() * 0.02
                });
            }
            
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }
            
            function drawHeart(x, y, size, opacity) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(size / 30, size / 30);
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.bezierCurveTo(-12, -22, -28, -5, 0, 18);
                ctx.bezierCurveTo(28, -5, 12, -22, 0, -8);
                ctx.fillStyle = `rgba(255, 107, 157, ${opacity})`;
                ctx.fill();
                ctx.restore();
            }
            
            function drawBigHeart(x, y, size, time) {
                // Pulsing effect
                const pulse = 1 + Math.sin(time * 3) * 0.08;
                const actualSize = size * pulse;
                
                // Outer glow
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, actualSize * 1.5);
                gradient.addColorStop(0, 'rgba(255, 107, 157, 0.4)');
                gradient.addColorStop(0.5, 'rgba(255, 107, 157, 0.1)');
                gradient.addColorStop(1, 'rgba(255, 107, 157, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, actualSize * 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Main heart
                drawHeart(x, y, actualSize, 0.9);
            }
            
            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                
                // Clear with solid background
                ctx.fillStyle = '#030305';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Update which reason to show (one every 1.5 seconds)
                const newReasonIndex = Math.min(Math.floor(elapsed / 1.5), reasons.length - 1);
                if (newReasonIndex !== currentReasonIndex && newReasonIndex >= 0) {
                    currentReasonIndex = newReasonIndex;
                    reasonOpacity = 0;
                    playTone(500 + currentReasonIndex * 50, 0.2, 'sine', 0.1);
                }
                
                // Fade in current reason
                if (currentReasonIndex >= 0) {
                    reasonOpacity = Math.min(reasonOpacity + 0.05, 1);
                }
                
                // Update and draw floating hearts
                hearts.forEach(h => {
                    // Update position
                    h.y -= h.speedY;
                    h.phase += h.wobbleSpeed;
                    const wobbleX = Math.sin(h.phase) * h.wobbleAmount;
                    
                    // Pulse the size
                    const pulse = 1 + Math.sin(elapsed * h.pulseSpeed * 60) * 0.1;
                    
                    // Reset if off screen
                    if (h.y < -50) {
                        h.y = canvas.height + 50;
                        h.x = Math.random() * canvas.width;
                    }
                    
                    // Draw the heart
                    drawHeart(h.x + wobbleX, h.y, h.size * pulse, h.opacity);
                });
                
                // Draw big central heart
                drawBigHeart(cx, cy - 80, 70, elapsed);
                
                // Draw reasons with nice typography
                ctx.textAlign = 'center';
                
                for (let i = 0; i <= currentReasonIndex && i < reasons.length; i++) {
                    const isCurrentReason = i === currentReasonIndex;
                    const alpha = isCurrentReason ? reasonOpacity : 0.5;
                    const scale = isCurrentReason ? (0.8 + reasonOpacity * 0.2) : 0.9;
                    const y = cy + 60 + i * 45;
                    
                    // Text shadow/glow for current reason
                    if (isCurrentReason && reasonOpacity > 0.5) {
                        ctx.font = `bold ${24 * scale}px Quicksand, sans-serif`;
                        ctx.fillStyle = `rgba(255, 107, 157, ${(reasonOpacity - 0.5) * 0.4})`;
                        ctx.fillText(reasons[i], cx, y);
                    }
                    
                    // Main text
                    ctx.font = `bold ${22 * scale}px Quicksand, sans-serif`;
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fillText(reasons[i], cx, y);
                    
                    // Small heart icon before text for current
                    if (isCurrentReason) {
                        const textWidth = ctx.measureText(reasons[i]).width;
                        ctx.font = '16px Arial';
                        ctx.fillStyle = `rgba(255, 107, 157, ${alpha})`;
                        ctx.fillText('♥', cx - textWidth / 2 - 20, y);
                        ctx.fillText('♥', cx + textWidth / 2 + 20, y);
                    }
                }
                
                // Continue animation for 10 seconds
                if (elapsed < 10) {
                    animationId = requestAnimationFrame(animate);
                }
            }
            
            animate();
        }

        // ==================== SCENE 4C: MAGIC BOOK ====================
        function drawMagicBook() {
            const canvas = document.getElementById('magic-book-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Responsive sizing
            const isMobile = canvas.width < 600;
            const isSmallMobile = canvas.width < 400;
            
            const promises = [
                { icon: "🛡️", text: "Te proteger" },
                { icon: "💎", text: "Te cherir" },
                { icon: "😊", text: "Te faire rire" },
                { icon: "💕", text: "T'aimer toujours" }
            ];
            
            let startTime = Date.now();
            let currentPromiseIndex = -1;
            let animationId = null;
            
            // Magical particles
            const particles = [];
            
            // Book dimensions - responsive
            const bookWidth = isSmallMobile ? Math.min(200, canvas.width * 0.5) : 
                              isMobile ? Math.min(240, canvas.width * 0.45) : 
                              Math.min(280, canvas.width * 0.35);
            const bookHeight = bookWidth * 0.75;
            const pageWidth = bookWidth / 2 - 10;
            const pageHeight = bookHeight - 20;
            
            // Responsive font sizes
            const iconSize = isSmallMobile ? 14 : (isMobile ? 16 : 18);
            const textSize = isSmallMobile ? 10 : (isMobile ? 12 : 14);
            const lineSpacing = isSmallMobile ? 14 : (isMobile ? 16 : 18);
            
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }
            
            function easeOutBack(t) {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            }
            
            function drawBook(openProgress) {
                ctx.save();
                ctx.translate(cx, cy);
                
                // Book shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(0, bookHeight / 2 + 15, bookWidth * 0.7, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Book cover (back)
                ctx.fillStyle = '#5d3a1a';
                ctx.fillRect(-bookWidth / 2 - 5, -bookHeight / 2 - 5, bookWidth + 10, bookHeight + 10);
                
                // Left page (always visible)
                ctx.fillStyle = '#faf3e8';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = -2;
                ctx.fillRect(-bookWidth / 2 + 5, -bookHeight / 2 + 5, pageWidth, pageHeight);
                ctx.shadowColor = 'transparent';
                
                // Lines on left page
                ctx.strokeStyle = 'rgba(139, 69, 19, 0.15)';
                ctx.lineWidth = 1;
                const numLines = isSmallMobile ? 6 : (isMobile ? 8 : 10);
                for (let i = 0; i < numLines; i++) {
                    const y = -bookHeight / 2 + 25 + i * lineSpacing;
                    ctx.beginPath();
                    ctx.moveTo(-bookWidth / 2 + 15, y);
                    ctx.lineTo(-10, y);
                    ctx.stroke();
                }
                
                // Right page (always visible, no disappearing)
                ctx.fillStyle = '#faf3e8';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 2;
                ctx.fillRect(5, -bookHeight / 2 + 5, pageWidth, pageHeight);
                ctx.shadowColor = 'transparent';
                
                // Lines on right page
                for (let i = 0; i < numLines; i++) {
                    const y = -bookHeight / 2 + 25 + i * lineSpacing;
                    ctx.beginPath();
                    ctx.moveTo(15, y);
                    ctx.lineTo(bookWidth / 2 - 15, y);
                    ctx.stroke();
                }
                
                // Book spine
                const spineGradient = ctx.createLinearGradient(-8, 0, 8, 0);
                spineGradient.addColorStop(0, '#4a2a0a');
                spineGradient.addColorStop(0.3, '#6b4423');
                spineGradient.addColorStop(0.5, '#8b5a2b');
                spineGradient.addColorStop(0.7, '#6b4423');
                spineGradient.addColorStop(1, '#4a2a0a');
                ctx.fillStyle = spineGradient;
                ctx.fillRect(-6, -bookHeight / 2 - 5, 12, bookHeight + 10);
                
                // Gold decorations on spine
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(-4, -bookHeight / 2, 8, 3);
                ctx.fillRect(-4, bookHeight / 2 - 3, 8, 3);
                
                // Small heart decoration on spine
                ctx.font = '12px Arial';
                ctx.fillStyle = '#ffd700';
                ctx.textAlign = 'center';
                ctx.fillText('♥', 0, 0);
                
                ctx.restore();
            }
            
            function drawMagicalGlow() {
                const time = Date.now() / 1000;
                const pulse = 0.8 + Math.sin(time * 2) * 0.2;
                
                const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, bookWidth * 1.2 * pulse);
                gradient.addColorStop(0, 'rgba(255, 215, 0, 0.12)');
                gradient.addColorStop(0.5, 'rgba(255, 215, 0, 0.05)');
                gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(cx, cy, bookWidth * 1.2 * pulse, 0, Math.PI * 2);
                ctx.fill();
            }
            
            function addParticle(x, y) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3 - 1,
                    size: 2 + Math.random() * 3,
                    life: 1,
                    color: Math.random() > 0.5 ? '#ffd700' : '#fff8dc'
                });
            }
            
            function updateAndDrawParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            function drawPromisesOnBook(elapsed) {
                if (elapsed < 1.5) return;
                
                const promiseTime = elapsed - 1.5;
                const newPromiseIndex = Math.min(Math.floor(promiseTime / 1.3), promises.length - 1);
                
                if (newPromiseIndex !== currentPromiseIndex && newPromiseIndex >= 0 && newPromiseIndex < promises.length) {
                    currentPromiseIndex = newPromiseIndex;
                    
                    // Add sparkle particles around the book
                    for (let i = 0; i < 12; i++) {
                        addParticle(
                            cx + (Math.random() - 0.5) * bookWidth,
                            cy + (Math.random() - 0.5) * bookHeight
                        );
                    }
                    playMagic();
                }
                
                // Draw promises ON the book pages
                ctx.save();
                ctx.translate(cx, cy);
                
                // Calculate positions for promises (2 on left page, 2 on right page)
                const leftPageX = -bookWidth / 4 - 5;
                const rightPageX = bookWidth / 4 + 5;
                
                for (let i = 0; i <= currentPromiseIndex && i < promises.length; i++) {
                    const promise = promises[i];
                    const isNew = i === currentPromiseIndex;
                    
                    // Calculate animation progress for this promise
                    const promiseProgress = Math.min((promiseTime - i * 1.3) / 0.4, 1);
                    const animProgress = isNew ? easeOutBack(Math.max(0, promiseProgress)) : 1;
                    
                    if (animProgress <= 0) continue;
                    
                    const alpha = animProgress;
                    const scale = 0.6 + animProgress * 0.4;
                    
                    // Position: first 2 on left page, next 2 on right page
                    const isLeftPage = i < 2;
                    const pageX = isLeftPage ? leftPageX : rightPageX;
                    const rowIndex = i % 2;
                    const yOffset = -bookHeight / 4 + rowIndex * (bookHeight / 3);
                    
                    // Draw icon
                    ctx.font = `${iconSize * scale}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.globalAlpha = alpha;
                    ctx.fillText(promise.icon, pageX, yOffset - 15);
                    
                    // Draw text
                    ctx.font = `${isNew ? 'bold ' : ''}${textSize * scale}px Quicksand, sans-serif`;
                    ctx.fillStyle = isNew ? '#8b4513' : '#5d4e37';
                    ctx.fillText(promise.text, pageX, yOffset + 12);
                    
                    // Underline for emphasis on new items
                    if (isNew && alpha > 0.7) {
                        const textWidth = ctx.measureText(promise.text).width;
                        ctx.strokeStyle = `rgba(255, 215, 0, ${(alpha - 0.7) * 2})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(pageX - textWidth / 2, yOffset + 22);
                        ctx.lineTo(pageX + textWidth / 2, yOffset + 22);
                        ctx.stroke();
                    }
                }
                
                ctx.globalAlpha = 1;
                ctx.restore();
            }
            
            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                const duration = 8;
                
                // Clear with solid background
                ctx.fillStyle = '#030305';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw magical glow behind book
                drawMagicalGlow();
                
                // Draw the book (simple, stable version)
                const openProgress = Math.min(elapsed / 1.5, 1);
                drawBook(openProgress);
                
                // Draw promises on the pages
                drawPromisesOnBook(elapsed);
                
                // Update and draw particles
                updateAndDrawParticles();
                
                // Add ambient particles periodically
                if (Math.random() > 0.92 && elapsed > 0.5) {
                    addParticle(
                        cx + (Math.random() - 0.5) * bookWidth * 1.5,
                        cy + (Math.random() - 0.5) * bookHeight * 1.5
                    );
                }
                
                // Continue animation
                if (elapsed < duration) {
                    animationId = requestAnimationFrame(animate);
                }
            }
            
            animate();
        }

        // ==================== SCENE 4D: FLOATING POEM ====================
        function drawFloatingPoem() {
            const canvas = document.getElementById('poem-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Responsive font sizes
            const isMobile = canvas.width < 600;
            const isSmallMobile = canvas.width < 400;
            const baseFontSize = isSmallMobile ? 14 : (isMobile ? 17 : 22);
            const signatureFontSize = isSmallMobile ? 18 : (isMobile ? 20 : 24);
            const charSpacing = isSmallMobile ? 10 : (isMobile ? 13 : 18);
            const lineSpacing = isSmallMobile ? 35 : (isMobile ? 40 : 50);
            
            const poemLines = [
                "Dans l'echiquier de mon coeur,",
                "Tu es la Reine de mon bonheur.",
                "Chaque jour passe a tes cotes,",
                "Est un tresor a savourer.",
                "- Ton Roi"
            ];
            
            let letters = [];
            let currentLine = 0;
            let currentChar = 0;
            let frame = 0;
            let bgStars = [];
            
            // Background stars
            for (let i = 0; i < 80; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
            
            function animate() {
                ctx.fillStyle = 'rgba(3, 3, 5, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                frame++;
                
                // Draw twinkling stars
                bgStars.forEach(s => {
                    s.twinkle += 0.05;
                    const alpha = 0.3 + Math.sin(s.twinkle) * 0.3;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                });
                
                // Add letters one by one (typewriter effect)
                if (frame % 8 === 0 && currentLine < poemLines.length) {
                    if (currentChar < poemLines[currentLine].length) {
                        const totalLines = poemLines.length;
                        const totalHeight = totalLines * lineSpacing;
                        const startY = cy - totalHeight / 2;
                        const lineY = startY + currentLine * lineSpacing;
                        
                        // Measure text width for centering
                        ctx.font = currentLine === 4 ? `italic ${signatureFontSize}px Pacifico` : `${baseFontSize}px Playfair Display`;
                        const lineText = poemLines[currentLine].substring(0, currentChar + 1);
                        const fullLineWidth = poemLines[currentLine].length * charSpacing;
                        const startX = cx - fullLineWidth / 2;
                        
                        letters.push({
                            char: poemLines[currentLine][currentChar],
                            x: startX + currentChar * charSpacing,
                            y: lineY,
                            targetY: lineY,
                            alpha: 0,
                            line: currentLine,
                            float: Math.random() * Math.PI * 2
                        });
                        
                        playTone(400 + currentChar * 10, 0.05, 'sine', 0.05);
                        currentChar++;
                    } else {
                        currentLine++;
                        currentChar = 0;
                    }
                }
                
                // Draw letters
                letters.forEach(l => {
                    l.alpha = Math.min(l.alpha + 0.05, 1);
                    l.float += 0.03;
                    const floatY = Math.sin(l.float) * 3;
                    
                    ctx.font = l.line === 4 ? `italic ${signatureFontSize}px Pacifico` : `${baseFontSize}px Playfair Display`;
                    ctx.textAlign = 'left';
                    ctx.fillStyle = l.line === 4 ? `rgba(255, 215, 0, ${l.alpha})` : 
                                    l.line % 2 === 0 ? `rgba(255, 200, 210, ${l.alpha})` : `rgba(255, 255, 255, ${l.alpha})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = l.line === 4 ? '#ffd700' : '#ff6b9d';
                    ctx.fillText(l.char, l.x, l.y + floatY);
                });
                
                ctx.shadowBlur = 0;
                
                if (frame < 600) {
                    requestAnimationFrame(animate);
                }
            }
            
            // Need to set font to measure properly
            ctx.font = '22px Playfair Display';
            animate();
        }

        // ==================== SCENE 5: CHESS PIECES FORM HEART ====================
        function drawChessHeart() {
            const canvas = document.getElementById('chess-heart-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Responsive sizing
            const isMobile = canvas.width < 600;
            const isSmallMobile = canvas.width < 400;
            const pieceSize = isSmallMobile ? 24 : (isMobile ? 30 : 36);
            const wordFontSize = isSmallMobile ? 10 : (isMobile ? 12 : 14);
            const wordRadius = isSmallMobile ? 40 : (isMobile ? 50 : 60);
            const titleFontSize = isSmallMobile ? 18 : (isMobile ? 20 : 24);
            const subtitleFontSize = isSmallMobile ? 14 : (isMobile ? 16 : 18);
            
            // Chess pieces with unicode symbols
            const pieceSymbols = ['♕', '♘', '♖', '♗', '♕', '♘', '♖', '♗'];
            const pieceColors = ['#ffd700', '#ff6b9d', '#ffd700', '#ff6b9d', '#ffd700', '#ff6b9d', '#ffd700', '#ff6b9d'];
            
            // Sweet words that will appear
            const sweetWords = [
                "Mon amour",
                "Ma vie", 
                "Mon coeur",
                "Ma joie",
                "Mon tresor",
                "Ma lumiere",
                "Mon etoile",
                "Mon tout"
            ];
            
            // Heart shape target positions - responsive scale
            const baseScale = Math.min(canvas.width, canvas.height);
            const heartScale = isSmallMobile ? baseScale * 0.0015 : (isMobile ? baseScale * 0.0018 : baseScale * 0.0022);
            let heartPositions = [];
            for (let t = 0; t < Math.PI * 2; t += Math.PI / 4) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                heartPositions.push({ x: cx + x * heartScale * 10, y: cy + y * heartScale * 10 - 20 });
            }
            
            // Start positions (scattered)
            let chessPieces = pieceSymbols.map((p, i) => ({
                symbol: p,
                color: pieceColors[i],
                word: sweetWords[i],
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                targetX: heartPositions[i].x,
                targetY: heartPositions[i].y,
                rotation: Math.random() * 360,
                targetRotation: 0,
                wordOpacity: 0
            }));
            
            let startTime = Date.now();
            let trailParticles = [];
            let centralHeartScale = 0;
            let centralTextOpacity = 0;
            
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }
            
            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                
                // Clear with solid background
                ctx.fillStyle = '#030305';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw trail particles
                for (let i = trailParticles.length - 1; i >= 0; i--) {
                    const p = trailParticles[i];
                    p.alpha -= 0.03;
                    if (p.alpha <= 0) {
                        trailParticles.splice(i, 1);
                        continue;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.alpha, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 107, 157, ${p.alpha})`;
                    ctx.fill();
                }
                
                // Move pieces towards heart formation
                const formationProgress = Math.min(elapsed / 3, 1);
                const easedProgress = easeOutCubic(formationProgress);
                
                chessPieces.forEach((p, i) => {
                    // Smooth movement with easing
                    const delay = i * 0.1;
                    const pieceProgress = Math.max(0, Math.min((elapsed - delay) / 2.5, 1));
                    const easedPieceProgress = easeOutCubic(pieceProgress);
                    
                    // Interpolate position
                    p.x = p.x + (p.targetX - p.x) * 0.04;
                    p.y = p.y + (p.targetY - p.y) * 0.04;
                    p.rotation *= 0.95;
                    
                    // Add trail during movement
                    if (elapsed < 3 && Math.random() > 0.6) {
                        trailParticles.push({
                            x: p.x,
                            y: p.y,
                            size: 4 + Math.random() * 4,
                            alpha: 0.7
                        });
                    }
                    
                    // Draw piece with glow
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    
                    // Glow effect
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = p.color;
                    
                    ctx.font = `bold ${pieceSize}px Arial`;
                    ctx.fillStyle = p.color;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.symbol, 0, 0);
                    
                    ctx.restore();
                    
                    // Show sweet words after pieces settle
                    if (elapsed > 3.5) {
                        const wordDelay = 3.5 + i * 0.3;
                        if (elapsed > wordDelay) {
                            p.wordOpacity = Math.min(p.wordOpacity + 0.03, 1);
                            
                            // Draw word near the piece - responsive position
                            const wordAngle = (Math.PI * 2 / 8) * i - Math.PI / 2;
                            const wordX = p.targetX + Math.cos(wordAngle) * wordRadius;
                            const wordY = p.targetY + Math.sin(wordAngle) * wordRadius;
                            
                            ctx.font = `${wordFontSize}px Quicksand, sans-serif`;
                            ctx.fillStyle = `rgba(255, 255, 255, ${p.wordOpacity * 0.9})`;
                            ctx.textAlign = 'center';
                            ctx.fillText(p.word, wordX, wordY);
                        }
                    }
                });
                
                // Draw connecting lines when pieces are close enough
                if (elapsed > 2) {
                    const lineOpacity = Math.min((elapsed - 2) / 1, 0.5);
                    ctx.strokeStyle = `rgba(255, 107, 157, ${lineOpacity})`;
                    ctx.lineWidth = isMobile ? 1 : 2;
                    ctx.beginPath();
                    chessPieces.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                    ctx.closePath();
                    ctx.stroke();
                }
                
                // Draw central heart after formation
                if (elapsed > 4) {
                    centralHeartScale = Math.min(centralHeartScale + 0.02, 1);
                    const heartSize = (isMobile ? 30 : 40) * easeOutCubic(centralHeartScale);
                    const pulse = 1 + Math.sin(elapsed * 4) * 0.1;
                    
                    // Central heart glow
                    const gradient = ctx.createRadialGradient(cx, cy - 20, 0, cx, cy - 20, heartSize * 2);
                    gradient.addColorStop(0, 'rgba(255, 107, 157, 0.4)');
                    gradient.addColorStop(1, 'rgba(255, 107, 157, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 20, heartSize * 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Central heart
                    ctx.font = `${heartSize * pulse}px Arial`;
                    ctx.fillStyle = '#ff6b9d';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#ff6b9d';
                    ctx.fillText('♥', cx, cy - 20);
                    ctx.shadowBlur = 0;
                }
                
                // Draw "Pour toi, Kanto" text
                if (elapsed > 5) {
                    centralTextOpacity = Math.min(centralTextOpacity + 0.02, 1);
                    
                    ctx.font = `bold ${titleFontSize}px Quicksand, sans-serif`;
                    ctx.fillStyle = `rgba(255, 215, 0, ${centralTextOpacity})`;
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffd700';
                    ctx.fillText('Pour toi, Kanto', cx, cy + (isMobile ? 50 : 70));
                    
                    ctx.font = `${subtitleFontSize}px Quicksand, sans-serif`;
                    ctx.fillStyle = `rgba(255, 255, 255, ${centralTextOpacity * 0.8})`;
                    ctx.shadowBlur = 0;
                    ctx.fillText('Mon coeur t\'appartient', cx, cy + (isMobile ? 75 : 100));
                }
                
                // Continue animation
                if (elapsed < 12) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        // ==================== SCENE 6: MAGICAL NAME REVEAL ====================
        function drawMagicalName() {
            const canvas = document.getElementById('name-magic-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Responsive sizing
            const isMobile = canvas.width < 600;
            const isSmallMobile = canvas.width < 400;
            const letterSpacing = isSmallMobile ? 45 : (isMobile ? 60 : 80);
            const letterSize = isSmallMobile ? 45 : (isMobile ? 60 : 80);
            const circleRadius = isSmallMobile ? 120 : (isMobile ? 160 : 200);
            const subtitleSize = isSmallMobile ? 14 : (isMobile ? 18 : 24);
            
            const name = "KANTO";
            let letters = name.split('').map((char, i) => ({
                char,
                x: cx + (i - 2) * letterSpacing,
                y: cy,
                scale: 0,
                rotation: Math.random() * 720 - 360,
                particles: [],
                revealed: false
            }));
            
            let currentLetter = 0;
            let frame = 0;
            let magicCircleAngle = 0;
            
            function animate() {
                ctx.fillStyle = 'rgba(3, 3, 5, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                frame++;
                magicCircleAngle += 0.02;
                
                // Reveal letters one by one
                if (frame % 60 === 0 && currentLetter < letters.length) {
                    letters[currentLetter].revealed = true;
                    // Create particle burst
                    for (let i = 0; i < 30; i++) {
                        letters[currentLetter].particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10,
                            alpha: 1,
                            size: 2 + Math.random() * 4
                        });
                    }
                    playMagic();
                    currentLetter++;
                }
                
                // Draw magic circle - responsive
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.lineWidth = isMobile ? 1 : 2;
                ctx.beginPath();
                ctx.arc(cx, cy, circleRadius, magicCircleAngle, magicCircleAngle + Math.PI * 1.5);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, circleRadius * 0.9, -magicCircleAngle, -magicCircleAngle + Math.PI * 1.5);
                ctx.stroke();
                
                // Draw and animate letters
                letters.forEach((l, i) => {
                    if (l.revealed) {
                        // Animate scale and rotation
                        l.scale = Math.min(l.scale + 0.05, 1);
                        l.rotation *= 0.95;
                        
                        // Draw particles
                        l.particles.forEach(p => {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.alpha -= 0.02;
                            
                            ctx.beginPath();
                            ctx.arc(l.x + p.x, l.y + p.y, p.size, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
                            ctx.fill();
                        });
                        l.particles = l.particles.filter(p => p.alpha > 0);
                        
                        // Draw letter
                        ctx.save();
                        ctx.translate(l.x, l.y);
                        ctx.rotate(l.rotation * Math.PI / 180);
                        ctx.scale(l.scale, l.scale);
                        ctx.font = `bold ${letterSize}px Pacifico`;
                        ctx.fillStyle = '#ff6b9d';
                        ctx.shadowBlur = 30;
                        ctx.shadowColor = '#ff6b9d';
                        ctx.textAlign = 'center';
                        ctx.fillText(l.char, 0, 30);
                        ctx.restore();
                    }
                });
                
                // Draw subtitle when all revealed
                if (currentLetter >= letters.length && frame > 360) {
                    const alpha = Math.min((frame - 360) * 0.02, 1);
                    ctx.font = `${subtitleSize}px Cinzel`;
                    ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffd700';
                    ctx.fillText('Grave dans mon coeur pour toujours', cx, cy + (isMobile ? 70 : 100));
                }
                
                ctx.shadowBlur = 0;
                
                if (frame < 500) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        // ==================== ATTACK SYSTEM ====================
        function createAttacker(type, color, startX, startY) {
            const a = document.createElement('i');
            a.className = `fas fa-chess-${type} attacker`;
            a.style.left = startX + 'px';
            a.style.top = startY + 'px';
            a.style.color = color;
            document.body.appendChild(a);
            return a;
        }

        function hitSparks(x, y, count = 8) {
            for (let i = 0; i < count; i++) {
                const spark = document.createElement('div');
                spark.className = 'hit-spark';
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';
                document.body.appendChild(spark);
                gsap.to(spark, {
                    x: (Math.random() - 0.5) * 100,
                    y: (Math.random() - 0.5) * 100,
                    opacity: 0,
                    duration: 0.4,
                    ease: 'power2.out',
                    onComplete: () => spark.remove()
                });
            }
        }

        function slashEffect(x, y, angle) {
            const slash = document.createElement('div');
            slash.className = 'slash-effect';
            slash.style.left = x + 'px';
            slash.style.top = y + 'px';
            slash.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            document.body.appendChild(slash);
            gsap.to(slash, { opacity: 1, scaleX: 1.5, duration: 0.1, ease: 'power2.out' });
            gsap.to(slash, { opacity: 0, duration: 0.2, delay: 0.1, onComplete: () => slash.remove() });
        }

        function damagePopup(x, y, text) {
            const popup = document.createElement('div');
            popup.className = 'damage-popup';
            popup.textContent = text;
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            document.body.appendChild(popup);
            gsap.fromTo(popup, { scale: 0.5, opacity: 0 }, { scale: 1.2, opacity: 1, y: -30, duration: 0.3, ease: 'back.out(2)' });
            gsap.to(popup, { y: -80, opacity: 0, duration: 0.5, delay: 0.4, onComplete: () => popup.remove() });
        }

        function attackLetter(attacker, letterEl, angle, onComplete) {
            const letterRect = letterEl.getBoundingClientRect();
            const targetX = letterRect.left + letterRect.width / 2;
            const targetY = letterRect.top + letterRect.height / 2;

            // Charge towards letter
            attacker.classList.add('charging');
            gsap.to(attacker, {
                left: targetX - 30,
                top: targetY - 30,
                duration: 0.4,
                ease: 'power2.in',
                onComplete: () => {
                    attacker.classList.remove('charging');
                    attacker.classList.add('striking');

                    // Impact!
                    hitSparks(targetX, targetY, 12);
                    slashEffect(targetX, targetY, angle);
                    explode(targetX, targetY, '#ffd700', 8, 8);
                    damagePopup(targetX, targetY - 20, 'HIT!');
                    miniShake(8, 100);
                    gsap.to('#red-flash', { opacity: 0.3, duration: 0.05, yoyo: true, repeat: 1 });
                    playHit(); // Sound effect

                    // Letter reacts
                    letterEl.classList.add('hit');
                    setTimeout(() => letterEl.classList.remove('hit'), 300);

                    // Attacker bounces back
                    gsap.to(attacker, {
                        left: parseFloat(attacker.style.left) + (Math.random() - 0.5) * 100,
                        top: parseFloat(attacker.style.top) - 50,
                        duration: 0.3,
                        ease: 'power2.out',
                        onComplete: () => {
                            attacker.classList.remove('striking');
                            if (onComplete) onComplete();
                        }
                    });
                }
            });
        }

        function finalBlow(attackers, letterEl, onComplete) {
            const letterRect = letterEl.getBoundingClientRect();
            const targetX = letterRect.left + letterRect.width / 2;
            const targetY = letterRect.top + letterRect.height / 2;

            // All attackers charge together
            attackers.forEach((a, i) => {
                gsap.to(a, {
                    left: targetX - 30 + (Math.random() - 0.5) * 60,
                    top: targetY - 30 + (Math.random() - 0.5) * 60,
                    duration: 0.3,
                    delay: i * 0.05,
                    ease: 'power3.in'
                });
            });

            setTimeout(() => {
                // Massive impact!
                hitSparks(targetX, targetY, 25);
                explode(targetX, targetY, '#ff3333', 30, 15);
                explode(targetX, targetY, '#ffd700', 20, 12);
                slashEffect(targetX, targetY, 0);
                slashEffect(targetX, targetY, 45);
                slashEffect(targetX, targetY, 90);
                slashEffect(targetX, targetY, 135);
                damagePopup(targetX, targetY - 30, 'K.O!');
                shake(15, 300);
                gsap.to('#flash', { opacity: 0.6, duration: 0.08, yoyo: true, repeat: 1 });
                playImpact(); // Sound effect

                // Letter destroyed
                letterEl.classList.add('destroyed');

                // Remove attackers
                attackers.forEach(a => {
                    gsap.to(a, { opacity: 0, scale: 0, duration: 0.3, delay: Math.random() * 0.2, onComplete: () => a.remove() });
                });

                if (onComplete) onComplete();
            }, 400);
        }

        // ==================== LETTER CARRIER SYSTEM ====================
        function createLetterCarrier(type, color, letter, startX, startY) {
            // Create container for piece + letter
            const container = document.createElement('div');
            container.style.cssText = `position: fixed; left: ${startX}px; top: ${startY}px; z-index: 200; opacity: 0;`;
            
            // Chess piece
            const piece = document.createElement('i');
            piece.className = `fas fa-chess-${type}`;
            piece.style.cssText = `font-size: 3rem; color: ${color}; filter: drop-shadow(0 0 15px ${color}); display: block; text-align: center;`;
            
            // Letter being carried (above the piece)
            const letterEl = document.createElement('span');
            letterEl.textContent = letter;
            letterEl.style.cssText = `
                font-family: 'Pacifico', cursive;
                font-size: clamp(2rem, 8vw, 5rem);
                color: #ff6b9d;
                text-shadow: 0 0 20px #ff6b9d, 0 0 40px #ff6b9d;
                display: block;
                text-align: center;
                margin-bottom: 5px;
                animation: letterFloat 0.5s ease-in-out infinite alternate;
            `;
            
            container.appendChild(letterEl);
            container.appendChild(piece);
            document.body.appendChild(container);
            
            return { container, piece, letterEl };
        }

        function deliverLetter(carrier, targetX, targetY, delay, onDeliver) {
            const { container, piece, letterEl } = carrier;
            
            // Appear
            gsap.to(container, { opacity: 1, duration: 0.3, delay: delay });
            
            // Float in with dramatic entrance
            gsap.to(container, {
                left: targetX,
                top: targetY - 100, // Hover above target
                duration: 1.5,
                delay: delay + 0.3,
                ease: 'power2.inOut',
                onComplete: () => {
                    // Sparkle effect
                    sparkle(targetX + 30, targetY - 50, 8);
                    playMagic();
                    
                    // Letter drops down to position
                    gsap.to(letterEl, {
                        y: 60,
                        scale: 1.2,
                        duration: 0.4,
                        ease: 'bounce.out',
                        onComplete: () => {
                            // Letter stays, piece flies away
                            gsap.to(piece, {
                                y: -150,
                                x: (Math.random() - 0.5) * 200,
                                rotation: 360,
                                opacity: 0,
                                duration: 0.8,
                                ease: 'power2.out'
                            });
                            
                            // Transfer letter to the actual Kanto element
                            if (onDeliver) onDeliver();
                            
                            // Remove letter from carrier
                            gsap.to(letterEl, {
                                opacity: 0,
                                duration: 0.3,
                                delay: 0.1,
                                onComplete: () => {
                                    setTimeout(() => container.remove(), 500);
                                }
                            });
                        }
                    });
                }
            });
        }
